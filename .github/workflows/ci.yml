name: Verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  credential-free:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.33.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:credential-free

  development-neon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
      APP_URL: http://localhost:3000
      LOG_LEVEL: silent
      DATABASE_RESOURCE_ENV: development
      DATABASE_URL: ${{ secrets.DEVELOPMENT_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DEVELOPMENT_DIRECT_URL }}
      DEVELOPMENT_NEON_ENDPOINT_ID: ${{ secrets.DEVELOPMENT_NEON_ENDPOINT_ID }}
      PRODUCTION_NEON_ENDPOINT_ID: ${{ secrets.PRODUCTION_NEON_ENDPOINT_ID }}
      DEVELOPMENT_DATABASE_CONFIRMATION: estate-sales-bakersfield-development-neon-test-schemas
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.33.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require Development Neon identity
        shell: bash
        run: |
          for name in DATABASE_URL DIRECT_URL DEVELOPMENT_NEON_ENDPOINT_ID PRODUCTION_NEON_ENDPOINT_ID; do
            if [ -z "${!name}" ]; then
              echo "BLOCKED - $name is not configured"
              exit 2
            fi
          done
          if [ "$DEVELOPMENT_NEON_ENDPOINT_ID" = "$PRODUCTION_NEON_ENDPOINT_ID" ]; then
            echo "BLOCKED - Development and Production endpoint identifiers must differ"
            exit 2
          fi
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:test:check
      - run: pnpm test:integration
      - run: pnpm test:e2e
        env:
          CI: "true"
