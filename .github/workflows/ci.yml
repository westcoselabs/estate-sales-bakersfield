name: Verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  credential-free:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:credential-free

  test-neon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      TEST_DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
      TEST_NEON_ENDPOINT_ID: ${{ secrets.TEST_NEON_ENDPOINT_ID }}
      TEST_DATABASE_CONFIRMATION: estate-sales-bakersfield-isolated-test-neon
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: env.TEST_DATABASE_URL == ''
        run: echo "BLOCKED - isolated Test Neon secrets are not configured"
      - if: env.TEST_DATABASE_URL != ''
        run: pnpm exec playwright install --with-deps chromium
      - if: env.TEST_DATABASE_URL != ''
        run: pnpm db:test:check
      - if: env.TEST_DATABASE_URL != ''
        run: pnpm test:integration
      - if: env.TEST_DATABASE_URL != ''
        run: pnpm test:e2e
        env:
          CI: "true"
