name: Live non-production provider verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:live
        env:
          APP_ENV: preview
          DATABASE_RESOURCE_ENV: preview
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PREVIEW_DIRECT_URL }}
          BLOB_RESOURCE_ENV: preview
          BLOB_READ_WRITE_TOKEN: ${{ secrets.PREVIEW_BLOB_READ_WRITE_TOKEN }}
          VERCEL_BENCHMARK_URL: ${{ vars.PREVIEW_VERCEL_BENCHMARK_URL }}
          CRON_SECRET: ${{ secrets.PREVIEW_CRON_SECRET }}
