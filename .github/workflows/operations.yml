name: Daily operational readiness

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * *"

permissions:
  contents: read

concurrency:
  group: operational-readiness
  cancel-in-progress: false

jobs:
  readiness:
    # Enable only after the Production smoke tests and release gate pass.
    if: vars.PRODUCTION_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.33.2
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/check-operational-readiness.ts --run
        env:
          APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
          CRON_SECRET: ${{ secrets.PRODUCTION_CRON_SECRET }}
